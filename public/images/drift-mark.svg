<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Drift">
  <title>Drift</title>
  <desc>Concentric arcs and a precision puzzle tile — the Drift mark.</desc>
  <defs>
    <linearGradient id="drift-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A48CFF" />
      <stop offset="55%" stop-color="#7B5CFF" />
      <stop offset="100%" stop-color="#FFD27A" />
    </linearGradient>
    <linearGradient id="drift-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B5CFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#A48CFF" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Soft backdrop disc -->
  <circle cx="100" cy="100" r="86" fill="url(#drift-fill)" />

  <!-- Drift trails: three nested arcs sweeping the same axis -->
  <path d="M 30 100 A 70 70 0 0 1 170 100" fill="none" stroke="url(#drift-stroke)" stroke-width="3" stroke-linecap="round" opacity="0.95" />
  <path d="M 44 100 A 56 56 0 0 1 156 100" fill="none" stroke="url(#drift-stroke)" stroke-width="2.5" stroke-linecap="round" opacity="0.65" />
  <path d="M 58 100 A 42 42 0 0 1 142 100" fill="none" stroke="url(#drift-stroke)" stroke-width="2" stroke-linecap="round" opacity="0.4" />

  <!-- Precision puzzle tile, slightly off-axis to imply motion -->
  <g transform="translate(78 110) rotate(-8)">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="none" stroke="url(#drift-stroke)" stroke-width="2.4" />
    <!-- Inner notch suggesting a puzzle interlock -->
    <path d="M 22 0 V 8 A 6 6 0 0 0 28 14 H 36 V 22" fill="none" stroke="url(#drift-stroke)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Lead anchor dot -->
  <circle cx="100" cy="38" r="4" fill="#FFD27A" />
</svg>
