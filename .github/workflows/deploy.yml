name: Deploy Luna Maze

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build

      - name: Setup Node for Genesis
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Genesis dependencies
        run: npm ci --prefix experiments/genesis

      - name: Check Genesis simulation
        run: node --experimental-strip-types --test experiments/genesis/tests/simulation.test.mjs

      - name: Build Genesis terraforming simulator
        env:
          GITHUB_PAGES_BUILD: '1'
        run: npm run build --prefix experiments/genesis

      - name: Add Genesis to the studio export
        run: |
          test -f experiments/genesis/dist/client/index.html
          mkdir -p dist/genesis
          cp -a experiments/genesis/dist/client/. dist/genesis/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
